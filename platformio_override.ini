; WLED build for QuinLED Dig-Next-2 + Multi-Relay usermod
; Source: DedeHai/WLED, branch WLEDpixelBus_PR (17.0.0-dev with channel remapping)
; Put this file next to platformio.ini in the WLED folder.

[platformio]
default_envs = dignext2_relay

[env:dignext2_relay]
extends = env:esp32dev
custom_usermods = ${env:esp32dev.custom_usermods} multi_relay
build_flags = ${env:esp32dev.build_flags} -D WLED_RELEASE_NAME=\"DigNext2_Relay\"
